plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.medchainalarm'
version = '1.0.0'

android {
  namespace "expo.modules.medchainalarm"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  implementation "androidx.core:core-ktx:1.17.0"
  // HeadlessJsTaskService: records alarm actions in the app database while the app is closed
  compileOnly "com.facebook.react:react-android"
}
